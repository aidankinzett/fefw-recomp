The last %d presented frames; the scale tops out at %.0f ms (16.7 ms = 60 fps, 33.3 ms = 30 fps).	Последние %d показанных кадров; шкала до %.0f мс (16.7 мс = 60 fps, 33.3 мс = 30 fps).

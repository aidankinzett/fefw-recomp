An output wider than 16:9 (21:9, 32:9, or a wide window with Output size = the window's size) widens the 3D view and keeps the menus, HUD, text and movies in the centred 16:9 area, after Kompas9's ultrawide patch. A narrower output (16:10) gets the 16:9 picture letterboxed. Off: the game's 16:9 picture is stretched to a wide output.	Вывод шире 16:9 (21:9, 32:9 или широкое окно при «Разрешение вывода» = размер окна) расширяет 3D-обзор, а меню, интерфейс (HUD), текст и ролики остаются в центральной области 16:9 — по патчу Kompas9 для сверхшироких экранов. При более узком выводе (16:10) картинка 16:9 выводится с чёрными полосами. «Выкл.»: картинка игры 16:9 растягивается на широкий вывод.
The 3D render size per side as a share of the output; the game's upscaler (Graphics > Upscaler) fills the rest. 100% renders at the output size and only anti-aliases. = Размер отрисовки 3D по каждой стороне как доля от вывода; остальное достраивает апскейлер игры («Графика» > «Апскейлер»). 100% — отрисовка в разрешении вывода, только сглаживание.
The shadow map's base size. Larger is sharper and costs GPU time and memory (8192: about 1.3 GB more). = Базовый размер карты теней. Больше — чётче, но дороже по времени GPU и видеопамяти (8192: примерно на 1.3 ГБ больше).
Quality = Качество
Docked gives every render configuration the docked one's shadows and effects, so a handheld or 1080p answer keeps them. = Качество док-режима даёт любой конфигурации отрисовки тени и эффекты док-режима — они сохраняются и в портативной конфигурации, и при 1080p.
What answers the game's DLSS calls. TAAU needs nothing; DLSS needs an RTX GPU and the Streamline DLLs ([upscale] dlss_dll); FSR 3 runs on any GPU with AMD's FidelityFX DLLs (upscalers\fsr next to the launcher, or [upscale] fsr_dll); XeSS runs on any GPU with DP4a (best on Intel Arc) and needs libxess.dll (upscalers\xess next to the launcher, or [upscale] xess_dll) and the Visual C++ 2015-2022 runtime. One that cannot run falls back to TAAU and the log names the missing file. Choosing DLSS or XeSS (or Auto with the DLLs present) takes effect at the next start. = Что обрабатывает вызовы DLSS игры. TAAU ничего не требует; DLSS нужны видеокарта RTX и DLL Streamline ([upscale] dlss_dll); FSR 3 работает на любой видеокарте с DLL AMD FidelityFX (upscalers\fsr рядом с лаунчером или [upscale] fsr_dll); XeSS работает на любой видеокарте с DP4a (лучше всего на Intel Arc) и требует libxess.dll (upscalers\xess рядом с лаунчером или [upscale] xess_dll) и среду выполнения Visual C++ 2015-2022. Если выбранный не может работать, используется TAAU, а в журнале указан недостающий файл. Выбор DLSS или XeSS (или «Авто» при наличии DLL) применится при следующем запуске.
FSR 3 sharpening = Резкость FSR 3
TAAU history = История TAAU
How much of the history TAAU keeps: higher is smoother and slower to follow change. = Сколько истории хранит TAAU: больше — плавнее, но медленнее реагирует на изменения.
One generated frame per rendered frame; the HUD is taken from the real frame. Keep vsync and low latency off. DLSS-G needs an RTX 40 or newer GPU, the Streamline DLLs (with the five frame generation adds) and Windows' hardware-accelerated GPU scheduling; FSR 3 runs on any GPU and needs amd_fidelityfx_vk.dll v1.1.4 (in upscalers\fsr next to the launcher). = Один сгенерированный кадр на каждый отрисованный; интерфейс (HUD) берётся из настоящего кадра. Держите V-Sync и низкую задержку выключенными. DLSS-G нужны видеокарта RTX 40 или новее, DLL Streamline (с пятью дополнениями для генерации кадров) и «Планирование GPU с аппаратным ускорением» в Windows; FSR 3 работает на любой видеокарте и требует amd_fidelityfx_vk.dll v1.1.4 (в upscalers\fsr рядом с лаунчером).
Keeps the game clock exact when frames are uneven: the game's step plus a quarter of the time it still owes. = Сохраняет точность игрового времени при неровных кадрах: шаг игры плюс четверть накопленного отставания.
Mouse controls = Управление мышью
Automatic: moving or clicking the mouse switches the game to its mouse controls, a key or the controller switches back. Always: the game stays in its mouse controls. Off: the game never sees a mouse. = «Автоматически»: движение или щелчок мыши переключает игру на управление мышью, клавиша или контроллер — обратно. «Всегда мышь»: игра остаётся в управлении мышью. «Выкл.»: игра не видит мышь.
Mouse speed = Скорость мыши
How far the game's cursor and camera move per mouse count, before the game's own speed settings. = Насколько сдвигаются курсор и камера игры на единицу перемещения мыши — до учёта настроек скорости самой игры.
Wake distance = Порог активации
How far the mouse must move (counts, within a quarter second) to switch to mouse controls. = Насколько должна сдвинуться мышь (в единицах, за четверть секунды), чтобы включилось управление мышью.
Capture the mouse = Захват мыши
While the game is in its mouse controls the Windows pointer is hidden and held in the window (the game draws its own cursor). A key, the controller, Alt+Tab or F1 frees it. = Пока игра в режиме управления мышью, указатель Windows скрыт и удерживается в окне (игра рисует свой курсор). Клавиша, контроллер, Alt+Tab или F1 освобождают его.
Now = Сейчас
Left / right or A to change. = Влево / вправо или A — изменить.
The game's movies are decoded on the CPU (dav1d). Skip makes each one end at once, as a skip does. = Ролики игры декодируются на CPU (dav1d). «Пропускать» сразу завершает каждый ролик, как при пропуске.
Frame rate log = Журнал частоты кадров
One line a second with the presented frame rate and the present pass's GPU time ([gfx] log_fps). = Раз в секунду — строка с частотой показанных кадров и временем GPU на проход вывода ([gfx] log_fps).
Play status log = Журнал состояния игры
One line a second with play mode's input state ([play] log_status). = Раз в секунду — строка с состоянием ввода в режиме игры ([play] log_status).

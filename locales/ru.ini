0 keeps the SDR look, 1 lets highlights reach the peak, 2 pushes them further. = 0 сохраняет вид SDR, 1 позволяет бликам достичь пиковой яркости, 2 поднимает их ещё выше.
same as paper white = как «Яркость белого»
1 is the sharpest. = 1 — максимальная резкость.
30 is the game's own. 60 runs gameplay at 60 at the right speed (dialogue text types twice as fast). 120 needs a frame limit of 120 or more and a fast PC; frame-counted effects such as the dialogue typing run 4 times as fast. = 30 — родная частота игры. 60 — геймплей на 60 кадрах с правильной скоростью (текст диалогов печатается вдвое быстрее). Для 120 нужны ограничение частоты кадров от 120 и мощный ПК; эффекты, привязанные к кадрам, например печать диалогов, идут в 4 раза быстрее.
A log line with the game clock's speed every this many seconds ([fefw] clock_log); 0 is off. = Строка в журнале со скоростью игрового времени раз в заданное число секунд ([fefw] clock_log); 0 — выкл.
A small frame rate counter in a corner. The hotkey flips it in the game. = Небольшой счётчик кадров в углу. Горячая клавиша включает и выключает его в игре.
Analog trigger travel that counts as ZL / ZR pressed. = Ход аналогового курка, при котором засчитывается нажатие ZL / ZR.
Borderless fullscreen keeps the desktop resolution and switches at once; exclusive takes over the display. Alt+Enter flips windowed and fullscreen. = «Полный экран без рамки» сохраняет разрешение рабочего стола и переключается мгновенно; эксклюзивный режим захватывает экран. Alt+Enter переключает между окном и полным экраном.
By label: the button printed A is the Switch A (Xbox layout). By position: the bottom button is the Switch B, as on a Switch pad. = «По надписи»: кнопка с буквой A — это A на Switch (раскладка Xbox). «По положению»: нижняя кнопка — это B на Switch, как на геймпаде Switch.
Everything the game plays. = Все звуки игры.
HDR10 or scRGB; Auto picks HDR10 when the display offers it. = HDR10 или scRGB; «Авто» выбирает HDR10, если экран его поддерживает.
How far the stick moves before it counts, as a share of its travel. = Насколько нужно отклонить стик, чтобы движение засчиталось, в долях полного хода.
How the game's output (Graphics > Output size) is scaled to the window when they differ. FSR 1 and NIS sharpen while they enlarge; a smaller window is always averaged. = Как вывод игры («Графика» > «Разрешение вывода») масштабируется под окно, если размеры различаются. FSR 1 и NIS повышают резкость при увеличении; в меньшем окне изображение всегда усредняется.
Lower it if the stick never reaches full speed (it tops out early). = Уменьшите, если стик не даёт полной скорости (упирается раньше времени).
NVIDIA Reflex or AMD Anti-Lag 2, whichever the GPU has. Keep it off with frame generation. = NVIDIA Reflex или AMD Anti-Lag 2 — что поддерживает видеокарта. С генерацией кадров держите выключенным.
Neutral is the game's own picture; Vivid adds a little contrast and colour. = «Нейтральный» — исходная картинка игры; «Яркий» добавляет немного контраста и цвета.
Off keeps SDR; Auto uses HDR when the display and Windows offer it; On runs the HDR pipeline anyway; Native uses the levels the game declares for an HDR TV. = «Выкл.» — остаётся SDR; «Авто» — HDR, если его поддерживают дисплей и Windows; «Вкл.» — HDR-конвейер работает в любом случае; «Родной» — уровни, которые игра заявляет для HDR-телевизора.
Off stretches the picture to the window. = Если выключено, картинка растягивается на всё окно.
Off: no forced vsync, the lowest latency; works with G-Sync / FreeSync and the frame limit. On: the display paces. = Выкл.: V-Sync не навязывается, задержка минимальна; работает с G-Sync / FreeSync и ограничением частоты кадров. Вкл.: темп задаёт дисплей.
One line of Reflex / Anti-Lag timings a second ([latency] log_timings in controls.ini). = Раз в секунду пишет в журнал строку с таймингами Reflex / Anti-Lag ([latency] log_timings в controls.ini).
Refresh rate follows the display. The game's own pace (30 / 60 / 120) still holds under it. = «Частота обновления» берётся у дисплея. Собственный темп игры (30 / 60 / 120) соблюдается и под этим пределом.
Screenshots leave the counter out unless this is on. = Если выключено, счётчика на снимках экрана нет.
Silent while the window is not in focus. = Без звука, пока окно не в фокусе.
The client size in windowed mode. It changes at once while windowed; in fullscreen it is the size the window goes back to. = Размер клиентской области в оконном режиме. В окне меняется сразу; в полноэкранном режиме — это размер, к которому вернётся окно.
The display the window moves to; the fullscreen modes use it. = Дисплей, на который переходит окно; его же используют полноэкранные режимы.
The game opens its audio device once. = Игра открывает устройство вывода звука один раз, при запуске.
The language of the game's text and voices. Automatic uses your Windows display language when the game has it, else English. It applies the next time the game starts. [tweaks] language in controls.ini; [system] language in fefw.ini wins over it. = Язык текста и озвучки игры. «Автоматически» — язык интерфейса Windows, если он есть в игре, иначе английский. Применится при следующем запуске игры. [tweaks] language в controls.ini; [system] language в fefw.ini важнее.
The lowest level written to the log ([log] level). = Минимальный уровень сообщений в журнале ([log] level).
The same for the right stick (the camera). = То же для правого стика (камера).
The size the game renders its picture, UI and post effects at (its DLSS output). Up to 3840 x 2160 at 16:9; wider shapes need Ultrawide. The window scales it (Display > Scaling to the window). = Размер, в котором игра отрисовывает картинку, интерфейс и постэффекты (её выход DLSS). До 3840 x 2160 при 16:9; для более широких форматов нужен «Сверхширокий экран». Окно масштабирует его («Экран» > «Масштабирование под окно»).
Which button icons the game shows ([prompts] style). = Какие значки кнопок показывает игра ([prompts] style).
[fps] key in controls.ini. = [fps] key в controls.ini.

Frame generation works best with vsync and low latency off (Frame rate tab). With vsync on, the game renders at most half the display's refresh rate. = Генерация кадров лучше всего работает с выключенными V-Sync и низкой задержкой (вкладка «Частота кадров»). С V-Sync игра отрисовывает не больше половины частоты обновления дисплея.
